[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aai-coding"
dynamic = ["version"]
description = "Pyskills for Answer.AI coding sessions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "aai-coding contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

dependencies = []

[project.optional-dependencies]
dev = [
  "fastship",
  "build",
  "twine",
]

[project.urls]
Homepage = "https://github.com/AnswerDotAI/aai-coding"

[tool.setuptools.dynamic]
version = { attr = "aai_coding.__version__" }

[tool.setuptools.packages.find]
include = ["aai_coding"]
