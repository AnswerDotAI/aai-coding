[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aai-coding"
dynamic = ["version"]
description = "Pyskills for Answer.AI coding sessions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "aai-coding contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

dependencies = ["llmdojo>=0.0.3"]

[project.entry-points.pyskills]
coding_patterns = "aai_coding.coding_patterns"
write_prose = "aai_coding.write_prose"
write_docs = "aai_coding.write_docs"
write_summary = "aai_coding.write_summary"
harness_docs = "aai_coding.harness_docs"
looker = "aai_coding.looker"
theory = "aai_coding.theory"

[project.scripts]
aai-hook = "aai_coding.harness:main"

[project.optional-dependencies]
dev = [
  "fastship",
  "build",
  "twine",
]

[project.urls]
Homepage = "https://github.com/AnswerDotAI/aai-coding"

[tool.setuptools.dynamic]
version = { attr = "aai_coding.__version__" }

[tool.setuptools.packages.find]
include = ["aai_coding"]

[tool.pytest.ini_options]
markers = ["slow: needs live network services; deselected by default"]
addopts = "-m 'not slow'"
