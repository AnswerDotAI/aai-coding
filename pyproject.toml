[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aai-coding"
dynamic = ["version"]
description = "Shared configuration, hooks, prompts, and skills for Answer.AI coding sessions"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "aai-coding contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.entry-points.pyskills]
harness_docs = "aai_coding.harness_docs"

[project.scripts]
aai-hook = "aai_coding.harness:main"
claudesub = "aai_coding.claudesub:main"

[project.optional-dependencies]
dev = [
  "fastship",
  "build",
  "twine",
]

[project.urls]
Homepage = "https://github.com/AnswerDotAI/aai-coding"

[tool.setuptools.dynamic]
version = { attr = "aai_coding.__version__" }

[tool.setuptools.packages.find]
include = ["aai_coding"]
